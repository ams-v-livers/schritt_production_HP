<div
  class="hero-visual reveal reveal-delay"
  id="heroPickup"
>

  <div class="hero-shape"></div>

  <div class="hero-yellow-circle"></div>

  <div class="hero-pickup-ring"></div>


  <div class="hero-pickup-label">

    <span>
      ✦
    </span>

    MONTHLY PICK UP

  </div>


  <div
    class="hero-pickup-image-wrap"
    id="heroPickupImageWrap"
  >

    <img
      id="heroPickupImage"
      src=""
      alt=""
      class="hero-pickup-image"
    >

  </div>


  <div class="hero-pickup-info">

    <div
      class="hero-pickup-platforms"
      id="heroPickupPlatforms"
    ></div>


    <h2
      id="heroPickupName"
    ></h2>


    <span
      id="heroPickupReading"
      class="hero-pickup-reading"
    ></span>


    <div class="hero-pickup-actions">

      <button
        class="hero-profile-button"
        id="heroPickupProfile"
        type="button"
      >

        PROFILE

        <span>
          ↗
        </span>

      </button>


      <a
        href="#"
        class="hero-live-button"
        id="heroPickupLive"
        target="_blank"
        rel="noopener noreferrer"
      >

        LIVE

        <span>
          ↗
        </span>

      </a>

    </div>

  </div>


  <span class="hero-pickup-star star-one">
    ✦
  </span>

  <span class="hero-pickup-star star-two">
    ★
  </span>

  <span class="hero-pickup-note">
    ♪
  </span>

</div>
